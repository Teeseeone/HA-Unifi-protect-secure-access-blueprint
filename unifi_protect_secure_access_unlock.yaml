blueprint:
  name: UniFi Protect Doorbell - Secure Fingerprint & NFC Unlock v0.2
  description: |
    v0.2: Unlock using optional/multiple fingerprint and NFC event entities
    from one UniFi Protect instance. Choose any ACTIVE registered user or
    specific allowlisted users. Both methods verify current ACTIVE user status
    against the Protect keyring; NFC must match a currently registered card.
    Empty allowlists deny access under the specific-users policy.
    Includes reconnect/restoration guards, notifications, Activity logging,
    cooldown and custom success/denied actions.

    ### View users, ACTIVE status and registered credentials

    In your own Home Assistant:

    1. Open **Settings → Tools → Actions**, or **Developer tools → Actions**
       if that is how your version labels the menu.
    2. Select **UniFi Protect: Get user keyring info**
       (`unifiprotect.get_user_keyring_info`).
    3. Switch to **UI mode** and select your doorbell or another device from
       the same Protect instance in the **UniFi Protect NVR** field.
    4. Click **Perform action**.
    5. Read the **Response** below the action:
       - `full_name`: the person's name.
       - `user_status: ACTIVE`: the account status required by this blueprint.
       - `ulp_id`: the user ID to copy into **Allowed users**.
       - `keys`: registered credentials; `key_type: fingerprint` or
         `key_type: nfc` identifies the method. `keys: []` means no credentials
         are listed for that user.

    ACTIVE is a UniFi account status; it does not indicate presence at home
    or a current login. An ACTIVE account alone does not unlock the door:
    a recognized fingerprint or registered NFC card is also required.

    **Any ACTIVE registered UniFi Protect user:** leave Allowed users empty.
    Credentials belonging to currently ACTIVE users can unlock through the
    selected readers, including credentials registered later.

    **Specific allowlisted users:** click Add under Allowed users and enter
    a friendly name and the person's `ulp_id` from the response. Permission
    applies to all their registered credentials, and they must still be ACTIVE.
    Copy the user ID, not `nfc_id` or `fingerprint_id`.

    If YAML mode reports that `device_id` is missing, switch to UI mode and
    select a device before performing the action.
  domain: automation
  author: Teeseeone (based on the original epiech blueprint)
  source_url: https://github.com/Teeseeone/unifi-protect-secure-access-blueprint/blob/main/unifi_protect_secure_access_unlock.yaml
  homeassistant:
    min_version: 2025.1.0

  input:
    protect_device:
      name: UniFi Protect device
      description: >
        Select any device from the same UniFi Protect instance as the doorbell.
        This is used to read the current user keyring for both fingerprint and NFC validation.
      selector:
        device:
          filter:
            - integration: unifiprotect

    fingerprint_entity:
      name: Fingerprint event entities (optional)
      description: >
        Select zero or more fingerprint event entities from the same Protect
        instance. Leave empty to disable this method.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: event
              integration: unifiprotect

    nfc_entity:
      name: NFC event entities (optional)
      description: >
        Select zero or more nfc event entities from the same Protect
        instance. Leave empty to disable this method.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: event
              integration: unifiprotect

    lock_entity:
      name: Smart lock
      description: The Home Assistant lock entity to unlock after authorization.
      selector:
        entity:
          filter:
            - domain: lock

    access_policy:
      name: Access policy
      description: >
        Any ACTIVE registered user allows credentials belonging to all currently
        ACTIVE users; Allowed users can be empty. Specific allowlisted users
        additionally requires their ULP ID in Allowed users. See the steps above
        to check user_status and registered credentials.
      default: specific_users
      selector:
        select:
          options:
            - label: Any ACTIVE registered UniFi Protect user
              value: any_active_user
            - label: Specific allowlisted users
              value: specific_users

    allowed_users:
      name: Allowed users
      description: >
        Used only with Specific allowlisted users. An empty list denies access.
        Enter the person's friendly name and their UniFi ulp_id. Find it using
        Get user keyring info in Home Assistant Actions (see the steps above).
        Copy ulp_id, not nfc_id or fingerprint_id.
        The same permission applies to that user's registered fingerprints
        and registered NFC cards.
      default: []
      selector:
        object:
          multiple: true
          label_field: name
          description_field: ulp_id
          fields:
            name:
              label: Name
              required: true
              selector:
                text: {}
            ulp_id:
              label: UniFi ULP ID
              required: true
              selector:
                text: {}

    notify_entities:
      name: Notification targets
      description: Optional notify entities for successful or denied access attempts.
      default: []
      selector:
        entity:
          filter:
            - domain: notify
          multiple: true

    notify_on_success:
      name: Notify on successful unlock
      default: true
      selector:
        boolean: {}

    notify_on_denied:
      name: Notify on denied access
      default: false
      selector:
        boolean: {}

    activity_logging:
      name: Log access attempts
      description: Add successful and denied attempts to Home Assistant Activity.
      default: true
      selector:
        boolean: {}

    cooldown_seconds:
      name: Successful unlock cooldown
      description: Prevent repeated unlock commands for a short period.
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: slider
          unit_of_measurement: seconds

    success_actions:
      name: Additional actions after successful unlock
      description: >
        Optional actions after a successful fingerprint or NFC authorization.
        Available variables: access_name, access_method, access_ulp_id,
        scanned_nfc_id, access_event_id.
      default: []
      selector:
        action: {}

    denied_actions:
      name: Additional actions after denied access
      description: >
        Optional actions after a denied fingerprint or NFC attempt.
        Available variables: access_name, access_method, denial_reason,
        scanned_nfc_id, access_ulp_id, access_event_id.
      default: []
      selector:
        action: {}

triggers:
  - trigger: state
    entity_id: !input fingerprint_entity
    id: fingerprint

  - trigger: state
    entity_id: !input nfc_entity
    id: nfc

conditions:
  # Reject restored/replayed state changes after startup/reconnect.
  - condition: template
    value_template: >-
      {{
        trigger.from_state is not none
        and trigger.to_state is not none
        and not trigger.from_state.attributes.get('restored', false)
        and not trigger.to_state.attributes.get('restored', false)
        and trigger.from_state.state not in ['unknown', 'unavailable']
        and trigger.to_state.state not in ['unknown', 'unavailable']
      }}

  # Require a genuinely new UniFi event ID.
  - condition: template
    value_template: >-
      {% set old_id = trigger.from_state.attributes.get('event_id', '') %}
      {% set new_id = trigger.to_state.attributes.get('event_id', '') %}
      {{ new_id not in ['', none] and new_id != old_id }}

actions:
  - variables:
      policy: !input access_policy
      allowed_users_config: !input allowed_users
      notify_targets: !input notify_entities
      do_notify_success: !input notify_on_success
      do_notify_denied: !input notify_on_denied
      do_activity_logging: !input activity_logging
      cooldown: !input cooldown_seconds

      access_method: >-
        {% if trigger.id == 'fingerprint' %}
          Fingerprint
        {% elif trigger.id == 'nfc' %}
          NFC
        {% else %}
          Unknown
        {% endif %}

      access_event_type: >-
        {{ trigger.to_state.attributes.get('event_type', '') }}

      access_event_id: >-
        {{ trigger.to_state.attributes.get('event_id', '') }}

      fingerprint_ulp_id: >-
        {% if trigger.id == 'fingerprint' %}
          {{ trigger.to_state.attributes.get('ulp_id', '') }}
        {% else %}
          {{ '' }}
        {% endif %}

      scanned_nfc_id: >-
        {% if trigger.id == 'nfc' %}
          {{ trigger.to_state.attributes.get('nfc_id', '') }}
        {% else %}
          {{ '' }}
        {% endif %}

      keyring:
        users: []

  # Read current registration/status for either valid credential event.
  # A service failure stops the automation before lock.unlock (fail closed).
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (trigger.id == 'fingerprint' and access_event_type == 'identified'
                  and fingerprint_ulp_id not in ['', none])
                 or (trigger.id == 'nfc' and access_event_type == 'scanned'
                  and scanned_nfc_id not in ['', none]) }}
        sequence:
          - action: unifiprotect.get_user_keyring_info
            data:
              device_id: !input protect_device
            response_variable: keyring

  - variables:
      matched_users: >-
        {% set ns = namespace(users=[]) %}
        {% for user in keyring.get('users', []) %}
          {% set match = namespace(found=false) %}
          {% if trigger.id == 'fingerprint' and access_event_type == 'identified'
                and fingerprint_ulp_id not in ['', none]
                and user.get('ulp_id', '') == fingerprint_ulp_id %}
            {% set match.found = true %}
          {% elif trigger.id == 'nfc' and access_event_type == 'scanned'
                and scanned_nfc_id not in ['', none] %}
            {% for key in user.get('keys', []) %}
              {% if key.get('key_type', '') == 'nfc'
                    and key.get('nfc_id', '') == scanned_nfc_id %}
                {% set match.found = true %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if match.found %}
            {% set ns.users = ns.users + [user] %}
          {% endif %}
        {% endfor %}
        {{ ns.users }}
      allowed_ulp_ids: >-
        {{ allowed_users_config | map(attribute='ulp_id') | list }}

  - variables:
      access_ulp_id: >-
        {{ matched_users[0].get('ulp_id', '') if matched_users | count == 1 else '' }}
      access_user_status: >-
        {{ matched_users[0].get('user_status', '') if matched_users | count == 1 else '' }}
      registered_name: >-
        {{ matched_users[0].get('full_name', '') if matched_users | count == 1 else '' }}

  - variables:
      access_name: >-
        {% set matches = allowed_users_config
          | selectattr('ulp_id', 'equalto', access_ulp_id) | list %}
        {% if matches | count > 0 %}
          {{ matches[0].name }}
        {% elif registered_name %}
          {{ registered_name }}
        {% else %}
          Unknown {{ access_method }}
        {% endif %}
      access_authorized: >-
        {{ matched_users | count == 1
           and access_ulp_id not in ['', none]
           and access_user_status == 'ACTIVE'
           and (policy == 'any_active_user'
                or (policy == 'specific_users' and access_ulp_id in allowed_ulp_ids)) }}
      denial_reason: >-
        {% if trigger.id == 'fingerprint' and access_event_type != 'identified' %}
          Fingerprint was not recognized by UniFi Protect
        {% elif trigger.id == 'nfc' and access_event_type != 'scanned' %}
          Unexpected NFC event type
        {% elif matched_users | count == 0 %}
          Credential is not registered to a current UniFi Protect user
        {% elif matched_users | count != 1 %}
          Credential ownership is ambiguous
        {% elif access_ulp_id in ['', none] %}
          Registered user has no UniFi ULP ID
        {% elif access_user_status != 'ACTIVE' %}
          Credential belongs to an inactive UniFi Protect user
        {% elif policy == 'specific_users' and access_ulp_id not in allowed_ulp_ids %}
          Registered user is not allowlisted
        {% else %}
          Access policy did not authorize this user
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ access_authorized | bool }}"
        sequence:
          - action: lock.unlock
            target:
              entity_id: !input lock_entity

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ do_activity_logging | bool }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Door access
                      message: >-
                        Door unlocked by {{ access_name }} using {{ access_method }}.
                      entity_id: !input lock_entity
                      domain: lock

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ do_notify_success | bool and notify_targets | length > 0 }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_targets }}"
                      sequence:
                        - action: notify.send_message
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            title: "🔓 Door unlocked"
                            message: >-
                              {{ access_name }} unlocked the door using {{ access_method }}.

          - choose: []
            default: !input success_actions

          - delay:
              seconds: "{{ cooldown | int(0) }}"

      - conditions:
          - condition: template
            value_template: "{{ not (access_authorized | bool) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ do_activity_logging | bool }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Door access denied
                      message: "{{ denial_reason }}."
                      entity_id: !input lock_entity
                      domain: lock

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ do_notify_denied | bool and notify_targets | length > 0 }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_targets }}"
                      sequence:
                        - action: notify.send_message
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            title: "🔐 Door access denied"
                            message: "{{ denial_reason }}."

          - choose: []
            default: !input denied_actions

mode: single
max_exceeded: silent
